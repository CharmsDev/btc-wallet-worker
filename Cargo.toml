[package]
name = "btc-wallet-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false
description = "Satchel: a Bitcoin wallet for AI agents, exposed as a Cloudflare Worker MCP server"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
bip39 = "2.2.2"
bitcoin = { version = "0.32.102", features = ["rand-std", "secp-lowmemory", "secp-recovery"] }
hex = "0.4"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "2"
subtle = "2"
zeroize = { version = "1", features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "=0.1.7"
getrandom = { version = "0.2", features = ["js"] }
worker = "0.8.7"

[dev-dependencies]
rand = "0.8"

[profile.release]
opt-level = "z"
codegen-units = 1
